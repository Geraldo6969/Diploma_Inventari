<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Ndrysho Fjalëkalimin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; padding: 40px; }
        .content-card { max-width: 450px; margin: 40px auto; background: white; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05); border: 1px solid #e2e8f0; }
        .form-control { border-radius: 8px; padding: 10px 14px; padding-right: 70px !important; } /* Lë hapësirë për tekstin SHFAQ */
        .btn-shfaq { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #4f46e5; font-size: 12px; font-weight: 700; cursor: pointer; z-index: 10; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="content-card">
    <h2 class="fw-bold h4 text-dark mb-2">🔒 Ndrysho Fjalëkalimin</h2>
    <p class="text-muted small mb-4">Shkruani fjalëkalimin tuaj të ri më poshtë.</p>
    
    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small" for="{{ field.id_for_label }}">{{ field.label }}</label>
                
                <div style="position: relative; display: block; width: 100%;">
                    {{ field }}
                    
                    {% if "password" in field.id_for_label or "pass" in field.id_for_label %}
                        <button type="button" class="btn-shfaq" onclick="togglePassword('{{ field.id_for_label }}', this)">
                            Shfaq
                        </button>
                    {% endif %}
                </div>
                
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-3" style="background: #4f46e5; border: none; border-radius: 8px;">
            Përditëso Fjalëkalimin
        </button>
    </form>
</div>

<script>
    function togglePassword(inputId, elementiButon) {
        const inputi = document.getElementById(inputId);
        
        if (inputi.type === "password") {
            inputi.type = "text";
            elementiButon.innerText = "Fsheh";
            elementiButon.style.color = "#ef4444"; // Kthehet në të kuqe kur fjalëkalimi është i zbuluar
        } else {
            inputi.type = "password";
            elementiButon.innerText = "Shfaq";
            elementiButon.style.color = "#4f46e5"; // Kthehet në blu/vjollcë
        }
    }
</script>

</body>
</html>
