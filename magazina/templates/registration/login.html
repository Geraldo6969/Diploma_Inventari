<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hyrje | Inventari</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; min-height: 100vh; background: #f4f7f6; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { width: 100%; max-width: 380px; background: white; padding: 28px; border-radius: 12px; box-shadow: 0 10px 24px rgba(0,0,0,0.12); }
        h1 { margin: 0 0 6px; color: #222; font-size: 28px; }
        .subtitle { margin: 0 0 22px; color: #667; }
        .field { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #2d3436; font-weight: 600; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #d9dee3; border-radius: 8px; font-size: 15px; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #0984e3; outline: none; box-shadow: 0 0 0 3px rgba(9,132,227,0.12); }
        .remember-row { display: flex; align-items: center; gap: 8px; margin: 8px 0 18px; color: #2d3436; }
        .remember-row label { margin: 0; font-weight: 500; }
        .remember-checkbox { width: 16px; height: 16px; }
        .errorlist, .form-error { margin: 0 0 14px; padding: 10px; border-radius: 8px; background: #fdecec; color: #9d1c1c; list-style: none; font-size: 14px; }
        button { width: 100%; border: none; border-radius: 8px; padding: 13px; background: #0984e3; color: white; font-weight: 700; font-size: 16px; cursor: pointer; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Hyrje</h1>
        <p class="subtitle">Mirë se erdhe te sistemi i inventarit.</p>

       <form method="post" id="id_formulari_login">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div class="form-error" style="background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px; margin-bottom: 20px; text-align: center;">
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    <div class="field" style="margin-bottom: 20px;">
        <label for="{{ form.username.id_for_label }}" style="font-weight: 700; color: #475569; font-size: 14px; display: block; margin-bottom: 8px;">Përdoruesi</label>
        {{ form.username.errors }}
        {{ form.username }}
    </div>

    <div class="field" style="margin-bottom: 20px;">
        <label for="{{ form.password.id_for_label }}" style="font-weight: 700; color: #475569; font-size: 14px; display: block; margin-bottom: 8px;">Fjalëkalimi</label>
        {{ form.password.errors }}
        {{ form.password }}
    </div>

    <div class="remember-row" style="display: flex; align-items: center; gap: 10px; margin-bottom: 24px; background: #f8fafc; padding: 10px 14px; border-radius: 10px; border: 1px solid #e2e8f0;">
        {{ form.remember_me }}
        <label for="{{ form.remember_me.id_for_label }}" style="font-weight: 600; color: #64748b; font-size: 13px; cursor: pointer; user-select: none;">{{ form.remember_me.label }}</label>
    </div>

    <button type="submit" style="background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%) !important; color: white !important; font-weight: 700; padding: 12px 24px; border-radius: 12px; border: none; width: 100%; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25); transition: all 0.2s; font-size: 16px;">
        Hyr në Sistem
    </button>
</form>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const formulari = document.getElementById('id_formulari_login');
        
        // Stilojmë me forcë inputet e Django-s që të bëhen ultra-moderne
        const kutiaUsername = document.querySelector('[name="username"]');
        const kutiaPassword = document.querySelector('[name="password"]');
        const checkboxRemember = document.querySelector('[name="remember_me"]');

        [kutiaUsername, kutiaPassword].forEach(fusha => {
            if (fusha) {
                fusha.style.setProperty('display', 'block', 'important');
                fusha.style.setProperty('width', '100%', 'important');
                fusha.style.setProperty('height', '46px', 'important');
                fusha.style.setProperty('border-radius', '10px', 'important');
                fusha.style.setProperty('padding', '12px 16px', 'important');
                fusha.style.setProperty('border', '1px solid #cbd5e1', 'important');
                fusha.style.setProperty('font-size', '14px', 'important');
                fusha.style.setProperty('color', '#1e293b', 'important');
                fusha.style.setProperty('box-sizing', 'border-box', 'important');

                // Kapim tastin Enter kur përdoruesi është duke shkruar tek ndonjëra nga kutitë
                fusha.addEventListener("keydown", function(event) {
                    if (event.key === "Enter") {
                        event.preventDefault(); // Ndalojmë bllokimet e mundshme të browser-it
                        formulari.submit(); // Dërgojmë formularin direkt me forcë
                    }
                });
            }
        });

        if (checkboxRemember) {
            checkboxRemember.style.setProperty('width', '18px', 'important');
            checkboxRemember.style.setProperty('height', '18px', 'important');
            checkboxRemember.style.setProperty('cursor', 'pointer', 'important');
        }
    });
</script>
    </main>
</body>
</html>
