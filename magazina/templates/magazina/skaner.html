<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Inventory — Skano QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #7c3aed; --danger: #dc2626; --sidebar-bg: #07172f; --light-bg: #f2f5fb; --border-color: #d8deea; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                linear-gradient(120deg, rgba(11, 31, 63, 0.13), transparent 34%),
                linear-gradient(220deg, rgba(124, 58, 237, 0.12), transparent 30%),
                linear-gradient(35deg, rgba(220, 38, 38, 0.08), transparent 24%),
                var(--light-bg);
            margin: 0;
            padding: 0;
            display: flex;
        }
        
        .sidebar { width: 260px; height: 100vh; background: var(--sidebar-bg); position: fixed; top: 0; left: 0; color: white; padding: 28px 24px; display: flex; flex-direction: column; justify-content: space-between; z-index: 1000; }
        .brand { font-size: 22px; font-weight: 800; color: #ddd6fe; display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li { margin-bottom: 8px; }
        .sidebar-menu a { color: #94a3b8; text-decoration: none; padding: 12px 16px; border-radius: 10px; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; transition: all 0.2s; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background: rgba(124, 58, 237, 0.2); color: #ffffff; }
        
        .main-content { margin-left: 260px; width: calc(100% - 260px); padding: 44px; min-height: 100vh; box-sizing: border-box; }
        .content-card { background: white; border-radius: 8px; box-shadow: 0 18px 38px rgba(15, 23, 42, 0.06); border: 1px solid var(--border-color); padding: 36px; max-width: 600px; margin: 0 auto; text-align: center; }
        
        /* Kutia e Kamerës me Kornizë Shënjestrimi */
        .scanner-container { position: relative; width: 100%; max-width: 400px; margin: 24px auto; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 12px 28px rgba(7,23,47,0.22); border: 2px solid #7c3aed; }
        #reader { width: 100% !important; border: none !important; }
        
        /* Vizat laserike për efekt */
        .laser-line { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--danger); box-shadow: 0 0 12px var(--danger); z-index: 10; animation: scanAnim 2s linear infinite; }
        @keyframes scanAnim { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        
        .logout-btn { background: none; border: none; color: #fecaca; width: 100%; text-align: left; padding: 12px 16px; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
        .logout-btn:hover { color: #ffffff; background: rgba(220, 38, 38, 0.16); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="brand"><i class="fa-solid fa-cubes"></i> E-Inventory</div>
            <ul class="sidebar-menu">
                <li><a href="{% url 'home' %}"><i class="fa-solid fa-boxes-stacked"></i> Produktet</a></li>
                <li><a href="{% url 'shto_produkt' %}"><i class="fa-solid fa-plus"></i> Shto Produkt</a></li>
                <li><a href="{% url 'raportet' %}"><i class="fa-solid fa-chart-line"></i> Raportet</a></li>
                <li><a href="{% url 'importo_excel' %}"><i class="fa-solid fa-file-excel"></i> Import Excel</a></li>
                <li><a href="{% url 'skaner' %}" class="active"><i class="fa-solid fa-qrcode"></i> Skano me QR</a></li>
            </ul>
        </div>
        <div>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Dil nga Sistemi</button>
            </form>
        </div>
    </div>

    <div class="main-content">
        <div class="content-card">
            <h2 class="fw-bold text-dark mb-1" style="letter-spacing: -0.5px;">📷 Skaner Optik i Kodit QR</h2>
            <p class="text-muted small">Lejoni qasjen në kamerë dhe vendosni kodin QR të produktit përpara saj.</p>
            
            <div class="scanner-container">
                <div class="laser-line"></div>
                <div id="reader"></div>
            </div>
            
            <div id="statusi-skanimit" class="alert alert-light border mt-3 fw-semibold text-secondary small">
                🔄 Po kërkohet kamera...
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('statusi-skanimit').className = "alert alert-success border mt-3 fw-bold text-success";
            document.getElementById('statusi-skanimit').innerText = "✅ Kod u gjet! Po ju ridrejtojmë...";
            // Pas skanimit të saktë, dërgoje direkt tek URL-ja që ka brenda kodi QR
            window.location.href = decodedText;
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
